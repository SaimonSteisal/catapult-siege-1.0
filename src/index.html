<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Catapult Siege: Осадный расчёт</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body{background:#0a0806}
  /* inline fallback so the first frame is never a white flash */
  #splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 38%,#2a2018,#0a0806);z-index:99;color:#e8dcc0;
    font-family:Roboto,"Noto Sans",system-ui,sans-serif;text-align:center;padding:24px}
  #splash .lg{font-size:clamp(22px,6vw,38px);font-weight:900;letter-spacing:.14em}
  #splash .sb{opacity:.7;letter-spacing:.3em;text-transform:uppercase;font-size:12px}
  #splash .sp{width:34px;height:34px;border:3px solid rgba(232,220,192,.2);border-top-color:#d9a62e;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="viewport"><canvas id="game"></canvas></div>
  <div id="ui"></div>
  <div id="devpanel"></div>
  <div id="splash">
    <div class="lg">CATAPULT SIEGE</div>
    <div class="sb">Осадный расчёт</div>
    <div class="sp"></div>
  </div>

  <!-- colour-blind SVG filters (referenced by CSS) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="cb-deuteranopia"><feColorMatrix type="matrix" values="0.625 0.7 0 0 0  0.07 0.03 0 0 0  0 0.3 0.3 0 0  0 0 0 1 0"/></filter>
    <filter id="cb-protanopia"><feColorMatrix type="matrix" values="0.15 0.85 0 0 0  0.11 0.89 0 0 0  0 0.2 0.8 0 0  0 0 0 1 0"/></filter>
    <filter id="cb-tritanopia"><feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.43 0.57 0 0  0 0.48 0.52 0 0  0 0 0 1 0"/></filter>
  </svg>

  <script type="module" src="game.js"></script>
</body>
</html>
